---
# Скопируйте в hosts.yml и подставьте IP или DNS из Terraform (private IP предпочтительнее для БД).
# ansible-inventory --list -i inventory/hosts.yml
#
# Пример получения IP после apply:
#   terraform -chdir=../terraform output -json | jq ...

all:
  vars:
    ansible_user: ec2-user
    # ansible_ssh_private_key_file: ~/.ssh/your-key.pem
    # Для доступа к private EC2 через bastion или VPN — настройте ProxyJump в ~/.ssh/config.

  children:
    app:
      hosts:
        app-01:
          ansible_host: 10.0.11.10

    postgresql:
      hosts:
        postgresql-01:
          ansible_host: 10.0.21.10

    redis:
      hosts:
        redis-01:
          ansible_host: 10.0.22.10
