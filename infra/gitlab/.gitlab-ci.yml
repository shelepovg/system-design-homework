# Подключение: GitLab → Settings → CI/CD → General pipelines →
# CI/CD configuration file → infra/gitlab/.gitlab-ci.yml
#
# В репозитории нет исходников Java: есть только Dockerfile'ы (infra/docker/services/*),
# ожидающие готовый JAR. Сборка образа и интеграционный тест запускаются, только если
# в CI/CD Variables задан файл API_GATEWAY_JAR (тип File) — артефакт сборки Spring Boot.
#
# Всегда выполняется проверка манифестов Kubernetes (kubectl kustomize).
# LikeC4 / npm в пайплайне не используются.
#
# Runner: validate:kustomize — обычный Docker/Kubernetes executor.
# build:docker и test:integration — docker executor с privileged или dind с privileged.
#
# Уведомления в Telegram (MVP): только (1) любой сбой пайплайна, (2) успешный деплой.
# Не уведомляем об успешных build/test — меньше шума, пока нет отдельного канала/сервиса логов CI.

stages:
  - build
  - test
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  IMAGE_API_GATEWAY: $CI_REGISTRY_IMAGE/api-gateway

default:
  interruptible: true

# --- build ---

validate:kustomize:
  stage: build
  image:
    name: bitnami/kubectl:1.31
    entrypoint: [""]
  script:
    - kubectl kustomize infra/k8s >/tmp/k8s-rendered.yaml
    - test -s /tmp/k8s-rendered.yaml
    - echo "Kustomize OK, строк:" && wc -l </tmp/k8s-rendered.yaml

build:docker:
  stage: build
  image: docker:24-cli
  services:
    - docker:24-dind
  rules:
    - if: $API_GATEWAY_JAR
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
  script:
    - test -f "$API_GATEWAY_JAR"
    - cp "$API_GATEWAY_JAR" "$CI_PROJECT_DIR/gateway.jar"
    - |
      docker build \
        -f infra/docker/services/api-gateway/Dockerfile \
        --build-arg JAR_FILE=gateway.jar \
        -t "$IMAGE_API_GATEWAY:$CI_COMMIT_SHA" \
        -t "$IMAGE_API_GATEWAY:latest" \
        "$CI_PROJECT_DIR"
    - docker push "$IMAGE_API_GATEWAY:$CI_COMMIT_SHA"
    - docker push "$IMAGE_API_GATEWAY:latest"

# --- test ---

test:integration:
  stage: test
  image: docker:24-cli
  services:
    - docker:24-dind
  rules:
    - if: $API_GATEWAY_JAR
  needs:
    - job: build:docker
  before_script:
    - apk add --no-cache curl
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
  script:
    - docker pull "$IMAGE_API_GATEWAY:$CI_COMMIT_SHA"
    - docker run -d --name gw-ci -p 8080:8080 "$IMAGE_API_GATEWAY:$CI_COMMIT_SHA"
    - sleep 20
    - |
      for i in $(seq 1 15); do
        if curl -sfS http://127.0.0.1:8080/actuator/health; then
          break
        fi
        sleep 3
      done
    - curl -sfS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
    - docker stop gw-ci
    - echo "GATEWAY_IMAGE_TESTED=1" > gateway-tested.env
  artifacts:
    reports:
      dotenv: gateway-tested.env

# --- deploy ---

deploy:kubernetes:
  stage: deploy
  image:
    name: bitnami/kubectl:1.31
    entrypoint: [""]
  needs:
    - job: validate:kustomize
    - job: test:integration
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    - |
      if [ -z "${KUBE_CONFIG:-}" ] || [ ! -f "${KUBE_CONFIG}" ]; then
        echo "Задайте CI/CD переменную KUBE_CONFIG (тип File) с kubeconfig для кластера"
        exit 1
      fi
    - mkdir -p ~/.kube
    - cp "$KUBE_CONFIG" ~/.kube/config
    - kubectl apply -k infra/k8s
    - |
      if [ "${GATEWAY_IMAGE_TESTED:-}" = "1" ]; then
        kubectl -n api-gateway set image deployment/api-gateway api-gateway="$IMAGE_API_GATEWAY:$CI_COMMIT_SHA"
        kubectl -n api-gateway rollout status deployment/api-gateway --timeout=180s
      else
        echo "Образ gateway в кластере не обновлялся: нет успешного test:integration (задайте API_GATEWAY_JAR и прогоните build+test), либо выполните kubectl set image вручную."
      fi

# --- уведомления (стадия .post, после всех объявленных stages) ---

.telegram_notify_base:
  image: curlimages/curl:8.5.0
  allow_failure: true

# Любой упавший job (validate, build, test, deploy) — один отчёт в Telegram
notify:telegram-pipeline-failed:
  extends: .telegram_notify_base
  stage: .post
  rules:
    - if: '$TELEGRAM_BOT_TOKEN && $TELEGRAM_CHAT_ID'
      when: on_failure
  script:
    - |
      TEXT="❌ CI FAILED: ${CI_PROJECT_NAME}
      Ветка: ${CI_COMMIT_REF_NAME}
      Коммит: ${CI_COMMIT_SHORT_SHA}
      Ссылка: ${CI_PIPELINE_URL}"
      curl -sS --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        -d "chat_id=${TELEGRAM_CHAT_ID}" \
        --data-urlencode "text=${TEXT}" || true

# Только успешное завершение ручного deploy на main (событие «выкладка прошла»)
notify:telegram-deploy-success:
  extends: .telegram_notify_base
  stage: .post
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $TELEGRAM_BOT_TOKEN && $TELEGRAM_CHAT_ID'
  needs:
    - job: deploy:kubernetes
  script:
    - |
      TEXT="✅ DEPLOY OK: ${CI_PROJECT_NAME}
      Ветка: ${CI_COMMIT_REF_NAME}
      Коммит: ${CI_COMMIT_SHORT_SHA}
      Пайплайн: ${CI_PIPELINE_URL}
      K8s: apply + при наличии GATEWAY_IMAGE_TESTED — rollout api-gateway."
      curl -sS --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        -d "chat_id=${TELEGRAM_CHAT_ID}" \
        --data-urlencode "text=${TEXT}" || true
