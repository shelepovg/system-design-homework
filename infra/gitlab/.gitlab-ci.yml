# Подключение файла: GitLab → Settings → CI/CD → General pipelines →
# «CI/CD configuration file» → infra/gitlab/.gitlab-ci.yml
#
# Контур: образ API Gateway (infra/docker/services/api-gateway/Dockerfile), манифесты infra/k8s.
# LikeC4 / npm в пайплайне не используются.
#
# Требования к runner: для build:docker и test:integration — docker executor с privileged
# или Kubernetes executor с privileged-сервисом docker:dind.

stages:
  - build
  - test
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  IMAGE_API_GATEWAY: $CI_REGISTRY_IMAGE/api-gateway
  STUB_JAR: infra/gitlab/stub-gateway/target/stub-gateway-0.0.1-SNAPSHOT.jar

default:
  interruptible: true

cache:
  key: stub-gateway-maven
  paths:
    - .m2/repository

# --- build ---

build:jars:
  stage: build
  image: maven:3.9.9-eclipse-temurin-21-alpine
  script:
    - cd infra/gitlab/stub-gateway && mvn -B -DskipTests package
  artifacts:
    paths:
      - infra/gitlab/stub-gateway/target/*.jar
    expire_in: 2 days

build:docker:
  stage: build
  image: docker:24-cli
  services:
    - docker:24-dind
  needs:
    - job: build:jars
      artifacts: true
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
  script:
    - test -f "$STUB_JAR"
    - |
      docker build \
        -f infra/docker/services/api-gateway/Dockerfile \
        --build-arg "JAR_FILE=$STUB_JAR" \
        -t "$IMAGE_API_GATEWAY:$CI_COMMIT_SHA" \
        -t "$IMAGE_API_GATEWAY:latest" \
        "$CI_PROJECT_DIR"
    - docker push "$IMAGE_API_GATEWAY:$CI_COMMIT_SHA"
    - docker push "$IMAGE_API_GATEWAY:latest"

# --- test (интеграционная проверка образа) ---

test:integration:
  stage: test
  image: docker:24-cli
  services:
    - docker:24-dind
  needs:
    - job: build:docker
  before_script:
    - apk add --no-cache curl
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
  script:
    - docker pull "$IMAGE_API_GATEWAY:$CI_COMMIT_SHA"
    - docker run -d --name gw-ci -p 8080:8080 "$IMAGE_API_GATEWAY:$CI_COMMIT_SHA"
    - sleep 20
    - |
      for i in $(seq 1 15); do
        if curl -sfS http://127.0.0.1:8080/actuator/health; then
          break
        fi
        sleep 3
      done
    - curl -sfS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
    - docker stop gw-ci

# --- deploy ---

deploy:kubernetes:
  stage: deploy
  image:
    name: bitnami/kubectl:1.31
    entrypoint: [""]
  needs:
    - job: test:integration
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    - |
      if [ -z "${KUBE_CONFIG:-}" ] || [ ! -f "${KUBE_CONFIG}" ]; then
        echo "Задайте CI/CD переменную KUBE_CONFIG (тип File) с kubeconfig для кластера"
        exit 1
      fi
    - mkdir -p ~/.kube
    - cp "$KUBE_CONFIG" ~/.kube/config
    - kubectl apply -k infra/k8s
    - kubectl -n api-gateway set image deployment/api-gateway api-gateway="$IMAGE_API_GATEWAY:$CI_COMMIT_SHA"
    - kubectl -n api-gateway rollout status deployment/api-gateway --timeout=180s
