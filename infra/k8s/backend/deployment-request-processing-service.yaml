apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-processing-service
  namespace: backend
  labels:
    app.kubernetes.io/name: request-processing-service
    app.kubernetes.io/part-of: system-design
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: request-processing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: request-processing-service
        app.kubernetes.io/part-of: system-design
    spec:
      containers:
        - name: request-processing-service
          image: request-processing-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: platform-env
            - secretRef:
                name: platform-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
