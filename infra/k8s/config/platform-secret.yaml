# Только для демо / локального кластера — смените пароли и вынесите в Sealed Secrets / External Secrets в проде.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: api-gateway
  labels:
    app.kubernetes.io/part-of: system-design
type: Opaque
stringData:
  # при необходимости client credentials для machine-to-machine к Keycloak
  KEYCLOAK_CLIENT_SECRET: "change-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: backend
  labels:
    app.kubernetes.io/part-of: system-design
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "change-me"
